# Local development: plain HTTP, no certificates. Use default.conf.example for production.
upstream pyrigs {
    server pyrigs:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /static/ {
        alias /var/www/static/;
        access_log off;
    }

    location / {
        proxy_pass http://pyrigs;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
